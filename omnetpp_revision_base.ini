# =====================================================================================
# Revision base configuration. EVERY experiment = this file + command-line overrides
# written by scripts/run_experiments.py (nothing else is varied implicitly).
# Geometry is FIXED for all runs: 2 km x 2 km, single gateway at (1000,1000), nodes uniform in [50,1950].
# =====================================================================================
[General]
network = lorawanproject.simulations.LoRaWANNetwork
cmdenv-express-mode = true
cmdenv-status-frequency = 100000s
cmdenv-event-banners = false
cmdenv-performance-display = false
**.scalar-recording = false
**.vector-recording = false
record-eventlog = false
debug-on-errors = false
warmup-period = 0s

sim-time-limit = 560s            # = 500 s traffic + 60 s settling for ACK/retransmission
**.simTimeLimit = 560s           # must equal sim-time-limit (modules use it to stop their timers)
**.node[*].trafficStopTime = 500s

*.numNodes = 50
*.numGateways = 1
*.playgroundSizeX = 2000m
*.playgroundSizeY = 2000m
*.gateway[0].initialX = 1000m
*.gateway[0].initialY = 1000m
**.node[*].initialX = uniform(50m, 1950m)
**.node[*].initialY = uniform(50m, 1950m)
**.node[*].mobility.constraintAreaMinX = 50m
**.node[*].mobility.constraintAreaMinY = 50m
**.node[*].mobility.constraintAreaMaxX = 1950m
**.node[*].mobility.constraintAreaMaxY = 1950m
**.node[*].minSpeed = 5mps
**.node[*].maxSpeed = 5mps
**.node[*].waitTime = 0s

# Radio / link
**.centerFrequency = 868MHz
**.bandwidth = 125kHz
**.radio.sensitivity = -137dBm
**.node[*].sensitivity = -137dBm
**.node[*].transmitPower = 14dBm
**.radio.transmitterPower = 14dBm
**.node[*].spreadingFactor = 7

# Traffic: 50-byte packets, mean interval 5 s, uniform 0.5-1.5x jitter, random start offset in [0,5] s
**.node[*].packetSize = 50
**.node[*].totalPayloadSize = 50000000
**.node[*].interPacketTime = 5s
**.node[*].trafficModel = "periodic"

# MAC (identical to the original paper runs: see docs/CONFIG_AUDIT.md)
**.node[*].confirmedMode = true
**.node[*].maxRetries = 8
**.node[*].retransmissionTimeout = 5.0s
**.node[*].useRetransmissionJitter = true

# ADR (standard LoRaWAN)
**.node[*].adr.adrEnabled = true
**.node[*].adr.windowSize = 20
**.node[*].adr.snrMargin = 10dB
**.node[*].adr.updateInterval = 1s
**.node[*].adr.adrAckLimit = 64
**.node[*].adr.adrAckDelay = 32
**.minSF = 7
**.maxSF = 12
**.node[*].adr.minTP = 2dBm
**.node[*].adr.maxTP = 14dBm

# Collision / duty-cycle / channel model switches (defaults = original model)
**.radio.collisionThreshold = 6dB
**.radio.captureEnabled = true
**.radio.symmetricMarking = false
**.radio.crossSfIsolation = 20dB
**.radio.perfectCrossSf = false
**.radio.dutyCycleMode = "current"
**.radio.dutyCycleLimit = 0.01
**.radio.dutyCycleWindow = 3600s
**.radio.airtimeModel = "legacy"
**.radio.numChannels = 1
**.radio.densityInterference = true
**.radio.fadingMode = "full"
**.radio.idealPhy = false
**.radio.txCurrentmA = 44
**.radio.supplyVoltage = 3.7

# Speed-only settings (do not change the radio model): coarser mobility step, no per-second vector logging
**.mobility.updateStep = 1s
**.node[*].perSecondLogging = false
**.radio.useMobilityPER = false
